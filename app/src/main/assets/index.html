<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA TV</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4f8ff;background:radial-gradient(ellipse at 75% 0%,#23335e 0%,transparent 55%),radial-gradient(ellipse at 0% 95%,#172a47,transparent 55%),#050816;overflow-x:hidden}main{padding:5vh 6vw}header{display:flex;align-items:center;justify-content:space-between}.brand{font-size:26px;font-weight:800;letter-spacing:5px;color:#8aefff}.clock{font-size:30px;font-weight:300}h1{font-size:clamp(35px,5vw,68px);margin:10vh 0 1vh;letter-spacing:-2px}p{color:#b1bfd6;font-size:20px}h2{margin-top:8vh;font-size:21px;font-weight:500}.apps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}.tile{border:1px solid #ffffff22;border-radius:20px;background:linear-gradient(145deg,#ffffff17,#ffffff08);color:white;min-height:125px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;font-size:18px;overflow:hidden}.tile .symbol{font-size:29px;color:#00e5ff}.tile:focus{outline:3px solid #00e5ff;outline-offset:3px;transform:scale(1.045);background:#173451;box-shadow:0 10px 40px #00e5ff33}.hint{font-size:14px;color:#8799b4;margin-top:30px}@media(max-width:800px){.apps{grid-template-columns:repeat(3,1fr)}main{padding:30px}}
</style></head><body><main><header><div class="brand">NEXA<span style="color:white"> TV</span></div><div id="clock" class="clock"></div></header><h1>Your screen.<br><span style="color:#00e5ff">Your space.</span></h1><p>A simpler home for everything you watch.</p><h2>All Apps <span id="count" style="color:#8799b4"></span></h2><section id="apps" class="apps" aria-label="Installed apps"></section><div class="hint">Use your remote arrows to navigate • Select to open • Back to exit</div></main><script>
function time(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}time();setInterval(time,30000);
let apps=[];try{if(window.Nexa)apps=JSON.parse(Nexa.apps())}catch(e){}const grid=document.getElementById('apps');document.getElementById('count').textContent='('+apps.length+')';if(!apps.length){grid.innerHTML='<p>No launchable apps found. Install this APK on Fire TV to display apps.</p>'}apps.forEach((app,i)=>{const b=document.createElement('button');b.className='tile';const s=document.createElement('span');s.className='symbol';s.textContent='◈';const n=document.createElement('span');n.textContent=app.name;b.append(s,n);b.onclick=()=>{if(window.Nexa)Nexa.launch(app.pkg)};grid.appendChild(b)});const buttons=()=>[...document.querySelectorAll('.tile')];document.addEventListener('keydown',e=>{const list=buttons(),idx=list.indexOf(document.activeElement),cols=5;let next=idx;if(e.key==='ArrowRight')next=Math.min(idx+1,list.length-1);if(e.key==='ArrowLeft')next=Math.max(idx-1,0);if(e.key==='ArrowDown')next=Math.min(idx+cols,list.length-1);if(e.key==='ArrowUp')next=Math.max(idx-cols,0);if(next!==idx&&list[next]){list[next].focus();e.preventDefault()}});if(buttons().length)buttons()[0].focus();
</script></body></html>
